name: daily
on:
  schedule:
    - cron: "40 18 * * *" # 00:10 IST
  workflow_dispatch:
jobs:
  buffer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Today's puzzle exists and at least 3 future days are published
        run: node tools/check.mjs puzzles/ --buffer 3
